name: Lean

# Builds each Lake project with its own pinned toolchain and the Mathlib
# binary cache. Pull requests and pushes build only the projects whose files
# changed; a manual run builds all of them. Projects that depend on Physlib or
# PhysLean compile that dependency from source and take the longest.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.select.outputs.projects }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed projects
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            chemlib:
              - 'chemlib/chemlib/**'
              - '.github/workflows/lean.yml'
            imo2026:
              - 'imo2026/base/**'
              - 'imo2026/gpt-5.6-solution/**'
              - 'imo2026/kimi-solution/**'
              - '.github/workflows/lean.yml'
            ipho2026-gpt:
              - 'ipho2026/*.lean'
              - 'ipho2026/Ipho2026Gpt56solBlind/**'
              - 'ipho2026/lakefile.toml'
              - 'ipho2026/lake-manifest.json'
              - 'ipho2026/lean-toolchain'
              - '.github/workflows/lean.yml'
            ipho2026-kimi:
              - 'ipho2026/Kimi/**'
              - '.github/workflows/lean.yml'
            icho2026-gpt-answer-blind:
              - 'icho2026/gpt-5.6-sol-answer-blind/**'
              - '.github/workflows/lean.yml'
            icho2026-gpt-full68:
              - 'icho2026/gpt-5.6-sol-full68-formalization/**'
              - '.github/workflows/lean.yml'
            icho2026-kimi-answer-blind:
              - 'icho2026/kimi-k3-answer-blind/**'
              - '.github/workflows/lean.yml'
            icho2026-kimi-nl-36:
              - 'icho2026/kimi-k3-nl-36-formalization/**'
              - '.github/workflows/lean.yml'
            qalg:
              - 'lean-qit-qlg/QAlg/lean-project/**'
              - '.github/workflows/lean.yml'
            qit:
              - 'lean-qit-qlg/QIT/lean-project/**'
              - '.github/workflows/lean.yml'

      - name: Emit project list
        id: select
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            CHANGED='["chemlib","imo2026","ipho2026-gpt","ipho2026-kimi","icho2026-gpt-answer-blind","icho2026-gpt-full68","icho2026-kimi-answer-blind","icho2026-kimi-nl-36","qalg","qit"]'
          fi
          echo "projects=${CHANGED:-[]}" >> "$GITHUB_OUTPUT"
          echo "Selected: ${CHANGED:-[]}"

  build:
    name: Build ${{ matrix.project }}
    needs: changes
    if: needs.changes.outputs.projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.projects) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Locate Lake package
        id: package
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          case "$PROJECT" in
            chemlib) dir=chemlib/chemlib ;;
            # imo2026/base has no MathFlowBench.lean root; the run harness
            # writes one per workspace. Build the cache-warming module instead.
            imo2026) dir=imo2026/base; build_args=MathFlowBench.CacheWarm ;;
            ipho2026-gpt) dir=ipho2026 ;;
            ipho2026-kimi) dir=ipho2026/Kimi ;;
            icho2026-gpt-answer-blind) dir=icho2026/gpt-5.6-sol-answer-blind ;;
            icho2026-gpt-full68) dir=icho2026/gpt-5.6-sol-full68-formalization ;;
            icho2026-kimi-answer-blind) dir=icho2026/kimi-k3-answer-blind ;;
            icho2026-kimi-nl-36) dir=icho2026/kimi-k3-nl-36-formalization ;;
            qalg) dir=lean-qit-qlg/QAlg/lean-project ;;
            qit) dir=lean-qit-qlg/QIT/lean-project ;;
            *) echo "unknown project: $PROJECT" >&2; exit 1 ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "build-args=${build_args:-}" >> "$GITHUB_OUTPUT"

      # ipho2026/Kimi ships no lake-manifest.json; its README resolves one with
      # `lake update`, so do the same here before lean-action runs.
      - name: Resolve ipho2026/Kimi dependencies
        if: matrix.project == 'ipho2026-kimi'
        working-directory: ipho2026/Kimi
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/lake" update

      - name: Install Lean and build pinned Lake project
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          lake-package-directory: ${{ steps.package.outputs.dir }}
          build-args: ${{ steps.package.outputs.build-args }}
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Check Chemlib public entrypoints
        if: matrix.project == 'chemlib'
        working-directory: chemlib/chemlib
        run: |
          lake env lean Chemlib.lean
          lake env lean AFPS2017.lean

      - name: Check IMO 2026 solutions
        if: matrix.project == 'imo2026'
        working-directory: imo2026/base
        run: |
          for solution in ../gpt-5.6-solution/*.lean ../kimi-solution/*.lean; do
            echo "Checking $solution"
            lake env lean "$solution"
          done

      - name: Check original T6-A5 module
        if: matrix.project == 'icho2026-kimi-nl-36'
        working-directory: icho2026/kimi-k3-nl-36-formalization
        run: lake env lean IChO2026Problems/problem_icho_2026_t6_a5.lean

      - name: Build T8 contest-model audit project
        if: matrix.project == 'icho2026-gpt-full68'
        working-directory: icho2026/gpt-5.6-sol-full68-formalization/t8-contest-model
        run: |
          lake exe cache get
          lake build
