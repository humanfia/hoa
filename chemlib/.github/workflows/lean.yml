name: Lean reproduction

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lean and build pinned Lake project
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: chemistrylib
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Check public entrypoints
        working-directory: chemistrylib
        run: |
          lake env lean Chemlib.lean
          lake env lean AFPS2017.lean
